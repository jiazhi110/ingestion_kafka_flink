name: Flink Job CI Pipeline (Build and Push to ECR)

# 觸發條件：當有程式碼推送到 main 或 develop 分支時，啟動此流程
on:
  push:
    branches:
      - main
      - develop

jobs:
  build-and-push-to-ecr:
    runs-on: ubuntu-latest
    # 增加權限設定，允許 GitHub Actions 向 AWS 請求臨時憑證
    permissions:
      id-token: write
      contents: read

    steps:
      # 第 1 步：簽出程式碼
      - name: Checkout repository
        uses: actions/checkout@v3

      # 第 2 步：設定 Java 環境
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      # 第 3 步：打包 Flink 應用程式
      - name: Build Flink Job with Maven
        working-directory: ./flink_jobs
        run: mvn clean package

      # 第 4 步：設定 AWS 憑證
      # 這裡我們使用 OIDC，這是最現代、最安全的作法，不需要長期有效的 Access Key
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # 您需要在 AWS IAM 中設定的角色 ARN，並儲存在 GitHub Secrets 中
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }} # 例如：us-east-1

      # 第 5 步：登入 Amazon ECR
      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 第 6 步：建置、標記並推送到 ECR
      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          # ECR 倉庫的 URI，例如：123456789012.dkr.ecr.us-east-1.amazonaws.com
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # 您在 ECR 中建立的倉庫名稱，儲存在 GitHub Secrets 中
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}
        run: |
          # 🔥🔥🔥 最终的修正：使用 shell 指令来可靠地截取前 7 位提交 ID 🔥🔥🔥
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ github.ref_name }}-${SHORT_SHA}"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
