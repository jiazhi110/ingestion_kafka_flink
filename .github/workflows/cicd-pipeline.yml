      #   if: always()  # 条件：始终运行（success/failure），用于警报
      #   uses: dawidd6/action-send-mail@v4  # 邮件action：SMTP支持Gmail等
      #   with:
      #     server_address: ${{ secrets.SMTP_HOST }}  # SMTP服务器：e.g., smtp.gmail.com
      #     server_port: 587  # 端口：TLS加密
      #     username: ${{ secrets.SMTP_USER }}  # 用户名：从secrets
      #     password: ${{ secrets.SMTP_PASS }}  # 密码：app password，非主密码
      #     subject: 'Flink ETL CI: ${{ job.status }} on ${{ github.ref_name }}'  # 主题：动态状态+分支
      #     to: ${{ secrets.EMAIL_TO }}  # 收件人：你的邮箱
