name: Flink ETL CI/CD Pipeline (Build/Test/Push/Trigger Infra)
# 整体名称：描述pipeline的全流程，从CI到触发CD

on:
  push:
    branches:
      - main  # 触发分支：main（prod环境）
      - develop  # develop（dev环境）
    paths:
      - 'flink_jobs/**'        # flink_jobs 文件夹修改时触发

jobs:
  build-test-push:
    runs-on: ubuntu-latest  # 运行环境：标准Ubuntu VM，适合Java/Docker构建
    # if: contains(github.event.head_commit.modified, 'flink_jobs/')
    permissions:
      id-token: write  # OIDC权限：允许GitHub向AWS请求临时凭证
      contents: read   # 读权限：拉取repo代码
    # 改用 artifact
    # outputs:
      # image: ${{ steps.build-image.outputs.image }}  # job输出：镜像URI，供下游dispatch使用
      # image: ${{ steps.build-image.outputs.encoded_image }}  # job输出：base64
      # image: ${{ steps.login-ecr.outputs.registry }}  # job输出：组合 image_uri（用 registry + repo，避免空/ skip）
      # registry: ${{ steps.login-ecr.outputs.registry }}
      # repository: ${{ steps.build-image.outputs.repository }}
      # tag: ${{ steps.build-image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # 升级到v4：更快拉取代码，支持子模块

      - name: Set up JDK 11
        uses: actions/setup-java@v4  # v4：优化Maven缓存，JDK11适合Flink
        with:
          java-version: '11'
          distribution: 'temurin'  # Eclipse Temurin：稳定开源JDK
          cache: maven  # 缓存：加速mvn下载依赖

      - name: Run Flink Job Tests
        working-directory: ./flink_jobs  # 工作目录：Flink源代码位置
        run: mvn test  # 运行测试：JUnit等；失败时pipeline中止，确保质量

        # 打包 Flink 應用程式
      - name: Build Flink Job with Maven
        working-directory: ./flink_jobs
        run: mvn clean package -DskipTests

        # 設定 AWS 憑證
        # 這裡我們使用 OIDC，這是最現代、最安全的作法，不需要長期有效的 Access Key
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4  # OIDC认证：安全，无需Access Key
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}  # IAM角色：需ECR push权限
          aws-region: ${{ secrets.AWS_REGION }}  # 区域：从secrets注入

      - name: Log in to Amazon ECR
        id: login-ecr  # 步骤ID：输出registry URI
        uses: aws-actions/amazon-ecr-login@v2  # ECR登录：临时token

      - name: Build, tag, and push image to Amazon ECR
        id: build-image  # 步骤ID：输出完整镜像URI
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}  # 注册表URI：从登录步骤获取,用这个会导致 Skip output 'image'，因为信息敏感。所以弃用改用plaintext
          # ECR_REPOSITORY: ${{ github.ref_name == 'main' && 'data-platform-prod-producer-repo' || 'data-platform-dev-producer-repo' }}  # 多环境逻辑：main用prod repo，develop用dev repo
          # ECR_REPOSITORY: ${{ github.ref_name == 'main' && secrets.PROD_ECR_REPO || secrets.DEV_ECR_REPO }}
          # 否定了用secret 的用法， 改用plaintext 的方式，因为如果用secret output，会导致 Skip output 'image'，因为信息敏感。
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}  #暂时用这个，回头如果用了在本地cd了一次后，生成了 ECR，然后再用那两个，记得要重新建立secret key
          # ECR_REGISTRY: '366019841267.dkr.ecr.ap-southeast-1.amazonaws.com'
          # ECR_REPOSITORY: 'ingestion_kafka_flink'
        run: |
          # 构建自定义标签：branch + short SHA，便于追溯版本
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="${{ github.ref_name }}-${SHORT_SHA}"
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .  # 构建镜像：假设Dockerfile在root或./flink_jobs
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG  # 推送版本标签
          
          # 推送latest标签：覆盖更新，供Terraform data源拉取最新
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          # --- 新增：更新SSM参数 --- 
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Updating Flink image URI to: $IMAGE_URI"
          aws ssm put-parameter \
            --name "/data-platform/dev/ingestion/flink_image_url" \
            --value "$IMAGE_URI" \
            --type "String" \
            --overwrite
          
          # 最终结果，改用 artifact
          # 把 image_uri 写进文件（artifact）
          # echo "$ECR_REGISTRY/$ECR_REPOSITORY:latest" > image_uri.txt

          # echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT  # 输出latest URI到job outputs

          # echo "encoded_image=$(echo $ECR_REGISTRY/$ECR_REPOSITORY:latest | base64 -w 0)" >> $GITHUB_OUTPUT
        
          # 无需 output full image（避免 skip），只需 registry 已够
          # 不要再输出完整的 image URI
          # echo "repository=${ECR_REPOSITORY}" >> $GITHUB_OUTPUT
          # echo "tag=latest" >> $GITHUB_OUTPUT

      # - name: Upload image artifact (image-info)
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: image-info
      #     path: image_uri.txt

      # 自己玩暂时不用
