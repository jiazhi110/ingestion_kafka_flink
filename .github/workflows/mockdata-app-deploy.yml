# 这是一个专业级的 CI/CD 流水线，它结合了两种主流的部署模式：
# 1. Flink 应用：作为“长期服务”进行部署和更新 (update-service)。
# 2. 数据生产者：作为“一次性任务”来运行 (run-task)，用于测试或批量生成数据。
# 它还包含了手动触发 (workflow_dispatch) 功能，让您可以随时从 GitHub UI 界面运行任一流程。

name: Deploy Data Applications to ECS

on:
  # 触发器 1: 当代码推送到 main 或 develop 分支时
  push:
    branches:
      - main
      - develop
    paths:
      - 'mock_data/**'
  # 触发器 2: 允许在 GitHub UI 上手动触发
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to check out'
        required: true
        default: 'develop'

jobs:
  # ===================================================================
  # Job : 运行一次性的模拟数据生产者
  # ===================================================================
  run-mock-data-producer:
    name: Run Mock Data Producer
    # 条件：当手动触发时，或当 push 事件修改了 mock_data/ 目录时运行。 弃用，改用 path:
    # if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[force producer]') || (github.event_name == 'push' && (contains(join(github.event.commits.*.modified, ' '), 'mock_data/') || contains(join(github.event.commits.*.added, ' '), 'mock_data/')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: 2. Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 3. Install dependencies and run tests
        run: |
          pip install -r requirements.txt
          python tests/test_data_generator.py

      - name: 4. 配置 AWS 身份凭证 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # role-to-assume: ${{ github.ref == 'refs/heads/main' && secrets.PROD_AWS_ROLE_ARN || secrets.DEV_AWS_ROLE_ARN }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}  # 暂时用这个。
          aws-region: ${{ secrets.AWS_REGION }}
      - name: 5. 登录到 Amazon ECR
        id: login-ecr-producer
        uses: aws-actions/amazon-ecr-login@v2
      - name: 6. 构建并推送 Producer Docker 镜像
        id: build-image-producer
        env:
          # ECR_REPOSITORY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_PRODUCER_ECR_REPO || secrets.DEV_PRODUCER_ECR_REPO }}
          ECR_REGISTRY: ${{ steps.login-ecr-producer.outputs.registry }}  # 注册表URI：从登录步骤获取,用这个会导致 Skip output 'image'，因为信息敏感。所以弃用改用plaintext
          # ECR_REPOSITORY: ${{ github.ref_name == 'main' && 'data-platform-prod-producer-repo' || 'data-platform-dev-producer-repo' }}  # 多环境逻辑：main用prod repo，develop用dev repo
          # ECR_REPOSITORY: ${{ github.ref_name == 'main' && secrets.PROD_ECR_REPO || secrets.DEV_ECR_REPO }}
          # 否定了用secret 的用法， 改用plaintext 的方式，因为如果用secret output，会导致 Skip output 'image'，因为信息敏感。
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}  #暂时用这个，回头如果用了在本地cd了一次后，生成了 ECR，然后再用那两个，记得要重新建立secret key
        run: |
          # 构建自定义标签：branch + short SHA，便于追溯版本
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_TAG="mockdata-${{ github.ref_name }}-${SHORT_SHA}"

          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f mock_data/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # 推送mockdata-latest标签：覆盖更新，供Terraform data源拉取最新
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:mockdata-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:mockdata-latest

          # --- 新增：更新SSM参数 ---
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:mockdata-latest"
          echo "Updating Mockdata image URI to: $IMAGE_URI"
          aws ssm put-parameter \
            --name "/data-platform/dev/ingestion/mockdata_producer_image_url" \
            --value "$IMAGE_URI" \
            --type "String" \
            --overwrite
      
      # - name: 5a. 渲染任务定义 (填入新镜像地址)
