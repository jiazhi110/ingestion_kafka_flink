  # ===================================================================
  # Job 2: 运行一次性的模拟数据生产者 (CLI 方案)
  # ===================================================================
  run-mock-data-producer:
    name: Run Mock Data Producer (CLI method)
    # 条件：当手动触发时，或当 push 事件修改了 mock_data/ 目录时运行。 弃用，改用 path:
    # if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[force producer]') || (github.event_name == 'push' && (contains(join(github.event.commits.*.modified, ' '), 'mock_data/') || contains(join(github.event.commits.*.added, ' '), 'mock_data/')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 1. 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - name: 2. 配置 AWS 身份凭证 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # role-to-assume: ${{ github.ref == 'refs/heads/main' && secrets.PROD_AWS_ROLE_ARN || secrets.DEV_AWS_ROLE_ARN }}
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}  # 暂时用这个。
          aws-region: ${{ secrets.AWS_REGION }}
      - name: 3. 登录到 Amazon ECR
        id: login-ecr-producer
        uses: aws-actions/amazon-ecr-login@v2
      - name: 4. 构建并推送 Producer Docker 镜像
        id: build-image-producer
        env:
          # ECR_REPOSITORY: ${{ github.ref == 'refs/heads/main' && secrets.PROD_PRODUCER_ECR_REPO || secrets.DEV_PRODUCER_ECR_REPO }}
          IMAGE_TAG: ${{ github.sha }}
          ECR_REGISTRY: ${{ steps.login-ecr-producer.outputs.registry }}  # 注册表URI：从登录步骤获取,用这个会导致 Skip output 'image'，因为信息敏感。所以弃用改用plaintext
          # ECR_REPOSITORY: ${{ github.ref_name == 'main' && 'data-platform-prod-producer-repo' || 'data-platform-dev-producer-repo' }}  # 多环境逻辑：main用prod repo，develop用dev repo
          # ECR_REPOSITORY: ${{ github.ref_name == 'main' && secrets.PROD_ECR_REPO || secrets.DEV_ECR_REPO }}
          # 否定了用secret 的用法， 改用plaintext 的方式，因为如果用secret output，会导致 Skip output 'image'，因为信息敏感。
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME }}  #暂时用这个，回头如果用了在本地cd了一次后，生成了 ECR，然后再用那两个，记得要重新建立secret key
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f mock_data/Dockerfile .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image_uri=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
      
      - name: 5a. 渲染任务定义 (填入新镜像地址)
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: mock_data/task-definition.json # 使用我们新创建的模板文件
          container-name: producer-container-name
          image: ${{ steps.build-image-producer.outputs.image_uri }}

      - name: Debug Inputs for Run Task
        run: |
          echo "Rendered Task Definition ARN: ${{ steps.render-task-def.outputs.task-definition-arn }}"

      - name: 5b. 运行一次性的 ECS 任务 (使用 AWS CLI)
        run: |
          echo "Running task with AWS CLI..."
          aws ecs run-task \
            --cluster ${{ github.ref == 'refs/heads/main' && 'data-platform-prod-cluster' || 'data-platform-dev-cluster' }} \
            --task-definition ${{ steps.render-task-def.outputs.task-definition-arn }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ secrets.PRIVATE_SUBNET_IDS }}],securityGroups=[${{ secrets.PRODUCER_SECURITY_GROUP_ID }}],assignPublicIp=DISABLED}" \
            --count 1

