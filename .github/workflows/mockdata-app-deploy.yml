# 这是一个专业级的 CI/CD 流水线，它结合了两种主流的部署模式：
# 1. Flink 应用：作为“长期服务”进行部署和更新 (update-service)。
# 2. 数据生产者：作为“一次性任务”来运行 (run-task)，用于测试或批量生成数据。
# 它还包含了手动触发 (workflow_dispatch) 功能，让您可以随时从 GitHub UI 界面运行任一流程。

name: Deploy Data Applications to ECS

on:
  # 触发器 1: 当代码推送到 main 或 develop 分支时
  push:
    branches:
      - main
      - develop
    paths:
      - 'mock_data/**'
  # 触发器 2: 允许在 GitHub UI 上手动触发
  workflow_dispatch:
    inputs:
      branch:
        description: 'The branch to check out'
        required: true
        default: 'develop'

