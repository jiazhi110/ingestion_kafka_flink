name: Sync Python Code to EC2

on:
  push:
    branches:
      - main
      - develop

jobs:
  sync-to-ec2:
    runs-on: ubuntu-latest
    
    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 配置 SSH secrets 并测试连接
      - name: Setup SSH environment and test
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          
          # 写入私钥并设置权限
          echo "$EC2_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 将 EC2 主机加入 known_hosts
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || {
            echo "Warning: Failed to add host key for $EC2_HOST"
          }
          
          # 测试 SSH 连接
          ssh -o StrictHostKeyChecking=no ec2-user@"$EC2_HOST" "echo SSH connection OK"

      # 3️⃣ 同步代码 (已修改)
      - name: Sync code to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          # 新增: 在同步前，先确保远程服务器上的目标目录存在
          ssh -o StrictHostKeyChecking=no ec2-user@"$EC2_HOST" "mkdir -p /home/ec2-user/projects/ingestion_kafka_flink"
          
          # 原有的 rsync 命令保持不变
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '*.pyc' \
            ./ ec2-user@"$EC2_HOST":/home/ec2-user/projects/ingestion_kafka_flink/