name: Sync Python Code to EC2

on:
  push:
    branches:
      - main
      - develop

jobs:
  sync-to-ec2:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ checkout 代码
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ 配置 SSH key，用于连接 EC2
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.1
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 3️⃣ 同步代码到 EC2
      - name: Sync code to EC2
        run: |
          rsync -avz --delete ./ ec2-user@${{ secrets.EC2_HOST }}:/home/ec2-user/projects/
