# Log4j configuration for Flink jobs
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

# Console appender
appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# File appender for local development
appender.file.name = FileAppender
appender.file.type = File
appender.file.fileName = /tmp/flink/logs/flink-job.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# Flink-specific logging
logger.flink.name = org.apache.flink
logger.flink.level = INFO

# Kafka connector logging
logger.kafka.name = org.apache.flink.connector.kafka
logger.kafka.level = INFO

# Custom job logging
logger.job.name = com.myjustin.flink
logger.job.level = DEBUG