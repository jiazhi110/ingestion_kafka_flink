services:
  zookeeper:
    image: bitnami/zookeeper:3.8
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    networks:
      - data-pipeline-net

  # Kafka Service, depends on external ZooKeeper (provided by zookeeper service)
  # Kafka 服务，依赖外部 ZooKeeper（由 zookeeper 服务提供）
  kafka:
    image: bitnami/kafka:3.7.0 # Use Bitnami Kafka image, includes Kafka and ZooKeeper
                               # 使用 Bitnami 的 Kafka 镜像，包含了 Kafka 和 ZooKeeper
    container_name: kafka
    ports:
      - "9092:9092" # Kafka listener port mapped to host, for local Python producer access
                    # Kafka 监听端口映射到宿主机，供本地Python生产者访问
    environment:
      # This is the final solution, note changes in KAFKA_CFG_LISTENERS and KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP
      # 这是最终的解决方案，请注意 KAFKA_CFG_LISTENERS 和 KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP 的变化
      KAFKA_CFG_LISTENERS: INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: INTERNAL://kafka:9093,EXTERNAL://localhost:9092   # kafka:9093, access within docker containers instead of external
                                                                                        # kafka:9093，在docker容器中去访问，而不是在外部了。
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_BROKER_ID: 1
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
    - zookeeper
    networks:
      - data-pipeline-net # Ensure all services are in the same network
                          # 确保所有服务在同一个网络中

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"  # Access at http://localhost:8080
                     # 访问地址 http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093  # Note: Access Kafka inside container using service name + internal port
                                                     # 注意：容器内访问 Kafka，要用容器名 + 内部端口
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
      - zookeeper
    networks:
      - data-pipeline-net

  # MinIO Service, simulates S3 compatible storage
  # MinIO 服务，模拟S3兼容存储
  minio:
    image: quay.io/minio/minio:latest # Always use the latest official MinIO image
                                      # MinIO官方镜像，永远使用最新的那一款
    container_name: minio
    ports:
      - "9000:9000" # MinIO API Port
                    # MinIO API 端口
      - "9001:9001" # MinIO Console Web UI Port
                    # MinIO Console Web UI 端口
    environment:
      MINIO_ROOT_USER: minioadmin # MinIO management username
                                  # MinIO管理用户名
      MINIO_ROOT_PASSWORD: minioadmin # MinIO management password
                                      # MinIO管理密码
    volumes:
      # Persist MinIO data to host project ./minio_data directory. Docker creates this directory automatically.
      # 将MinIO数据持久化到宿主机项目的 ./minio_data 目录下。Docker会自动创建这个目录
      - ./minio_data:/data 
    command: server /data --console-address ":9001" # Start MinIO service and specify console address
                                                    # 启动MinIO服务并指定控制台地址
    networks:
      - data-pipeline-net

  # Flink JobManager Service
  # Flink JobManager 服务
  jobmanager:
    # Use multi-stage build from current directory
    # image: apache/flink:1.17.2-scala_2.12
    build: .
    image: flink-ingestion:local
    container_name: jobmanager
    ports:
      - "8081:8081" # Flink Web UI port mapped to host
                    # Flink Web UI 端口映射到宿主机
      - "6123:6123" # Job Submission (RPC) Port - This is key!
                    # Job Submission (RPC) Port - 这个是关键！
    # volumes:
    #   - ./flink_jobs/target/flink-uber-job-1.0-SNAPSHOT.jar:/opt/flink/usrlib/my-app.jar
    command: jobmanager # Start JobManager
                        # 启动JobManager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      # Configure Flink to access MinIO credentials and endpoint
      # Flink container accesses MinIO via service name 'minio'
      # 配置Flink访问MinIO的凭据和端点。Flink容器内部通过服务名 'minio' 访问MinIO
      FLINK_PROPERTIES_s3.endpoint: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_KEY: minioadmin
      FLINK_PROPERTIES_s3.path.style.access: "true" # MinIO usually requires path style access
                                                    # MinIO通常需要路径样式访问
    networks:
      - data-pipeline-net

  # Flink TaskManager Service
  # Flink TaskManager 服务
  taskmanager:
    build: .
    image: flink-ingestion:local
    container_name: taskmanager
    depends_on:
      - jobmanager # Ensure JobManager starts first
                   # 确保JobManager先启动
    command: taskmanager # Start TaskManager
                         # 启动TaskManager
    environment:
      JOB_MANAGER_RPC_ADDRESS: jobmanager
      FLINK_PROPERTIES_taskmanager.numberOfTaskSlots: 2 # Number of slots per TaskManager
                                                        # 每个TaskManager的Slot数量
      # MinIO configs also need to be passed to TaskManager
      # MinIO 配置也需要传递给 TaskManager
      FLINK_PROPERTIES_s3.endpoint: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_KEY: minioadmin
      FLINK_PROPERTIES_s3.path.style.access: "true"
    networks:
      - data-pipeline-net

# Define internal network to ensure services can communicate
# 定义一个内部网络，确保所有服务可以互相通信
networks:
  data-pipeline-net:
    driver: bridge

# Define data volume for MinIO persistence
# 定义一个数据卷，用于MinIO的数据持久化
volumes:
  minio_data:
